<header class="header">
  <div class="header-container">
    <!-- Left: Logo -->
    <div class="logo">
      <span class="logo-text">Prahlad</span>
    </div>

    <!-- Middle: Heading -->
    <div class="heading">
      <h1>Cards Game</h1>
    </div>

    <!-- Right: Profile -->
    <div class="profile-container" (mouseenter)="showDropdown = true" (mouseleave)="showDropdown = false">
      <button class="profile-button" type="button" aria-label="Profile menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 12C14.7614 12 17 9.76142 17 7C17 4.23858 14.7614 2 12 2C9.23858 2 7 4.23858 7 7C7 9.76142 9.23858 12 12 12Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M20.59 22C20.59 18.13 16.74 15 12 15C7.26 15 3.41 18.13 3.41 22" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      
      <!-- Bridge area to prevent gap issues -->
       @if (showDropdown) {
        <div class="dropdown-bridge"></div>
       }
       
      <!-- Dropdown Menu -->
      @if (showDropdown) {
        <div class="dropdown">
            <div class="dropdown-item user-name">
            {{ userName }}
            </div>
            @if (isAdmin) {
              <button class="dropdown-item add-user-button" type="button" (click)="addUser()">
                Add User
              </button>
            }
            <button class="dropdown-item logout-button" type="button" (click)="logout()">
            Logout
            </button>
        </div>
      }
    </div>
  </div>
</header>
